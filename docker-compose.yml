services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trucking
    ports:
      - "5433:5432"  # 5433 on the host: avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
